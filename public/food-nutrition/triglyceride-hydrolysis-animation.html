<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triglyceride Hydrolysis — Interactive Animation</title>
  <link rel="stylesheet" href="../osmosis/bio-typography.css">
  <link rel="stylesheet" href="./ch5-reaction-animation.css">
  <link rel="stylesheet" href="../osmosis/embed.css">
  <script src="../osmosis/embed.js"></script>
  <script src="../osmosis/tool-back.js" data-position="top-right" data-hub="../osmosis/lab.html"></script>
</head>
<body>
  <header class="page-header">
    <h1 id="page-title">Triglyceride Hydrolysis</h1>
    <p id="page-subtitle">Triglyceride breaks down into glycerol and three fatty acids.</p>
    <p class="ch5-equation" id="page-equation">triglyceride + 3 H₂O → glycerol + 3 fatty acids</p>
  </header>
  <main class="stage-shell">
    <div class="canvas-wrap ch5-deck-wrap">
      <iframe id="deck-frame" class="ch5-deck-frame" src="./ch5/triglyceride-hydrolysis/index.html" title="Triglyceride Hydrolysis deck" allow="autoplay"></iframe>
    </div>
    <div class="caption-bar" aria-live="polite">
      <div class="caption-row"><span class="caption-step" id="caption-step">1</span><p class="caption-text" id="caption-en"></p></div>
      <p class="caption-text zh" id="caption-zh"></p>
    </div>
    <div class="controls">
      <button type="button" class="primary" id="btn-play">▶ Play slide</button>
      <button type="button" id="btn-prev">◀ Prev</button>
      <button type="button" id="btn-next">Next ▶</button>
      <button type="button" id="btn-restart">↺ Restart</button>
      <div class="progress-wrap">
        <input type="range" id="progress" min="0" max="4" step="1" value="0">
        <span class="progress-label" id="progress-label">Step 1 / 5</span>
      </div>
    </div>
  </main>
  <script type="module">
    const STEPS = [{ en: 'Triglyceride — locate the three ester bonds.', zh: '甘油三酯——找出三條酯鍵。' },
      { en: 'Water breaks each ester bond (hydrolysis).', zh: '水斷開每條酯鍵（水解）。' },
      { en: 'Circle an ester bond to be broken.', zh: '圈起將被斷開嘅酯鍵。' },
      { en: 'Add water molecule(s) — 3 H₂O for full triglyceride.', zh: '加入水分子——完全水解需要 3 個 H₂O。' },
      { en: 'Ester bond broken → glycerol + fatty acids.', zh: '酯鍵斷開→甘油 + 脂肪酸。' }];
    const frame = document.getElementById("deck-frame");
    const captionEn = document.getElementById("caption-en");
    const captionZh = document.getElementById("caption-zh");
    const captionStep = document.getElementById("caption-step");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnRestart = document.getElementById("btn-restart");
    const progress = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    function revealApi() { return frame.contentWindow?.Reveal; }
    function currentVideo() {
      const R = revealApi(); if (!R) return null;
      const slide = R.getCurrentSlide();
      return slide?.slideBackgroundContentElement?.querySelector("video");
    }
    function setCaption(i) {
      const s = STEPS[i] || STEPS[0];
      captionEn.textContent = s.en; captionZh.textContent = s.zh;
      captionStep.textContent = String(i + 1);
      progress.value = String(i);
      progressLabel.textContent = `Step ${i + 1} / ${STEPS.length}`;
    }
    function waitForReveal() {
      return new Promise((resolve) => {
        const poll = () => { const R = revealApi(); if (R?.isReady?.()) resolve(R); else setTimeout(poll, 80); };
        poll();
      });
    }
    frame.addEventListener("load", async () => {
      const R = await waitForReveal();
      R.on("slidechanged", (e) => setCaption(e.indexh));
      setCaption(R.getIndices().h);
    });
    btnPrev.addEventListener("click", () => revealApi()?.prev());
    btnNext.addEventListener("click", () => revealApi()?.next());
    btnRestart.addEventListener("click", () => { revealApi()?.slide(0); setCaption(0); });
    progress.addEventListener("input", () => { revealApi()?.slide(Number(progress.value)); setCaption(Number(progress.value)); });
    btnPlay.addEventListener("click", () => {
      const v = currentVideo();
      if (v) { v.paused ? v.play() : v.pause(); return; }
      revealApi()?.next();
    });
    setCaption(0);
  </script>
</body>
</html>
