  <script>
    const COPY = {
      en: {
        back: "← All comics",
        download: "Download A4 PDF",
        print: "Print",
        title: "Petalino Biologino: The Fold Code",
        subtitle: "Join Petalino Biologino in a six-page story about amino acids, folding, and why the right protein shape unlocks the Protein Lock.",
      },
      zh: {
        back: "← 返回漫画",
        download: "下载 A4 PDF",
        print: "打印",
        title: "花瓣仔：折叠密码",
        subtitle: "跟随花瓣仔，通过六页故事认识氨基酸、折叠，以及为什么正确形状才能打开蛋白质锁。",
      },
      "zh-Hant": {
        back: "← 返回漫畫",
        download: "下載 A4 PDF",
        print: "列印",
        title: "花瓣仔：折疊密碼",
        subtitle: "跟隨花瓣仔，透過六頁故事認識氨基酸、折疊，以及為什麼正確形狀才能打開蛋白質鎖。",
      },
    };

    function resolveLang() {
      try {
        const parentLang = window.parent.document.documentElement.lang;
        if (COPY[parentLang]) return parentLang;
      } catch (_) {}
      return COPY[document.documentElement.lang] ? document.documentElement.lang : "en";
    }

    function applyLang() {
      const lang = resolveLang();
      const copy = COPY[lang];
      document.documentElement.lang = lang;
      document.getElementById("back-link").textContent = copy.back;
      document.getElementById("download-link").textContent = copy.download;
      document.getElementById("print-button").textContent = copy.print;
      document.getElementById("story-title").textContent = copy.title;
      document.getElementById("story-subtitle").textContent = copy.subtitle;
    }

    applyLang();
    document.getElementById("print-button").addEventListener("click", () => window.print());

    try {
      new MutationObserver(applyLang).observe(window.parent.document.documentElement, {
        attributes: true,
        attributeFilter: ["lang"],
      });
    } catch (_) {}
  </script>
