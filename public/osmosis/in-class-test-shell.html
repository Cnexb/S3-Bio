<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Class Test | S3 Biology</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="./in-class-test-shell.css?v=ict20260710">
  <link rel="stylesheet" href="./embed.css">
  <script src="./embed.js"></script>
</head>
<body class="ict-shell">
  <nav class="ict-subnav" aria-label="In class test chapters">
    <div class="ict-subnav-pill" role="tablist">
      <button class="ict-subnav-btn active" type="button" role="tab" aria-selected="true" data-chapter="ch2" id="ict-tab-ch2">
        <span class="ict-subnav-label" id="ict-label-ch2">Ch 2</span>
      </button>
      <button class="ict-subnav-btn" type="button" role="tab" aria-selected="false" data-chapter="ch3" id="ict-tab-ch3">
        <span class="ict-subnav-label" id="ict-label-ch3">Ch 3</span>
      </button>
      <button class="ict-subnav-btn" type="button" role="tab" aria-selected="false" data-chapter="ch4" id="ict-tab-ch4">
        <span class="ict-subnav-label" id="ict-label-ch4">Ch 4</span>
      </button>
      <button class="ict-subnav-btn" type="button" role="tab" aria-selected="false" data-chapter="ch5" id="ict-tab-ch5">
        <span class="ict-subnav-label" id="ict-label-ch5">Ch 5</span>
      </button>
    </div>
    <button class="ict-open-tab-btn" type="button" id="ict-open-tab" hidden>
      <span class="material-symbols-outlined" aria-hidden="true">open_in_new</span>
      <span id="ict-open-tab-label">Open in new tab</span>
    </button>
  </nav>

  <main class="ict-frame-wrap">
    <iframe
      class="ict-chapter-frame"
      id="ict-chapter-frame"
      title="In class test chapter"
      src="./in-class-test-ch2.html?v=ict20260710"
    ></iframe>
  </main>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const isStandalone = params.get("standalone") === "1" || window.__S3BIO_STANDALONE__;
    const initialChapter = params.get("chapter") || "ch2";

    const CHAPTERS = {
      ch2: { file: "./in-class-test-ch2.html?v=ict20260710", title: "Ch 2 Cellular Organisation" },
      ch3: { file: "./in-class-test-ch3.html?v=ict20260710", title: "Ch 3 Membrane Transport" },
      ch4: { file: "./in-class-test-ch4.html?v=ict20260710", title: "Ch 4 Enzymes" },
      ch5: { file: "./in-class-test-ch5.html?v=ict20260710", title: "Ch 5 Food and Human" },
    };

    function chapterUrl(chapterId) {
      const base = CHAPTERS[chapterId]?.file;
      if (!base) return base;
      if (!isStandalone) return base;
      const url = new URL(base, window.location.href);
      url.searchParams.set("standalone", "1");
      return url.pathname + url.search;
    }

    const STRINGS = {
      en: {
        ch2: "Ch 2",
        ch3: "Ch 3",
        ch4: "Ch 4",
        ch5: "Ch 5",
        openTab: "Open in new tab",
        ch2Title: "Ch 2 Cellular Organisation — In Class Test",
        ch3Title: "Ch 3 Membrane Transport — In Class Test",
        ch4Title: "Ch 4 Enzymes — In Class Test",
        ch5Title: "Ch 5 Food and Human — In Class Test",
      },
      zh: {
        ch2: "第 2 章",
        ch3: "第 3 章",
        ch4: "第 4 章",
        ch5: "第 5 章",
        openTab: "在新标签页打开",
        ch2Title: "第 2 章 细胞组织 — 课堂测验",
        ch3Title: "第 3 章 跨膜运输 — 课堂测验",
        ch4Title: "第 4 章 酶 — 课堂测验",
        ch5Title: "第 5 章 食物与人类 — 课堂测验",
      },
      "zh-Hant": {
        ch2: "第 2 章",
        ch3: "第 3 章",
        ch4: "第 4 章",
        ch5: "第 5 章",
        openTab: "喺新分頁開啟",
        ch2Title: "第 2 章 細胞組織 — 課堂測驗",
        ch3Title: "第 3 章 細胞膜運輸 — 課堂測驗",
        ch4Title: "第 4 章 酶 — 課堂測驗",
        ch5Title: "第 5 章 食物與人類 — 課堂測驗",
      },
    };

    const frame = document.getElementById("ict-chapter-frame");
    const openTabBtn = document.getElementById("ict-open-tab");
    const openTabLabel = document.getElementById("ict-open-tab-label");
    const tabBtns = [...document.querySelectorAll(".ict-subnav-btn")];
    let activeChapter = CHAPTERS[initialChapter] ? initialChapter : "ch2";

    function resolveLang() {
      try {
        const parentLang = window.parent.document.documentElement.lang;
        if (parentLang && STRINGS[parentLang]) return parentLang;
      } catch (_) {}
      const local = document.documentElement.lang;
      if (local && STRINGS[local]) return local;
      return "en";
    }

    function standaloneShellUrl(chapterId) {
      const url = new URL(window.location.pathname, window.location.href);
      url.searchParams.set("standalone", "1");
      url.searchParams.set("chapter", chapterId);
      return url.href;
    }

    function applyLang(lang) {
      const copy = STRINGS[lang] || STRINGS.en;
      ["ch2", "ch3", "ch4", "ch5"].forEach((ch) => {
        const label = document.getElementById(`ict-label-${ch}`);
        if (label) label.textContent = copy[ch];
      });
      if (openTabLabel) openTabLabel.textContent = copy.openTab;
      document.documentElement.lang = lang;
      if (CHAPTERS[activeChapter]) {
        frame.title = copy[`${activeChapter}Title`] || CHAPTERS[activeChapter].title;
      }
    }

    function showChapter(chapterId, force = false) {
      if (!CHAPTERS[chapterId] || (!force && chapterId === activeChapter)) return;
      activeChapter = chapterId;
      frame.src = chapterUrl(chapterId);
      const lang = resolveLang();
      const copy = STRINGS[lang] || STRINGS.en;
      frame.title = copy[`${chapterId}Title`] || CHAPTERS[chapterId].title;

      tabBtns.forEach((btn) => {
        const isActive = btn.dataset.chapter === chapterId;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-selected", isActive ? "true" : "false");
      });
    }

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => showChapter(btn.dataset.chapter));
    });

    if (openTabBtn) {
      if (isStandalone) {
        openTabBtn.hidden = true;
      } else {
        openTabBtn.hidden = false;
        openTabBtn.addEventListener("click", () => {
          window.open(standaloneShellUrl(activeChapter), "_blank", "noopener");
        });
      }
    }

    showChapter(activeChapter, true);
    applyLang(resolveLang());

    try {
      const observer = new MutationObserver(() => applyLang(resolveLang()));
      observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    } catch (_) {}
  </script>
</body>
</html>
