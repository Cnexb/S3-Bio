<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maltose Condensation &amp; Hydrolysis — Animation</title>
  <link rel="stylesheet" href="./bio-typography.css">
  <link rel="stylesheet" href="./maltose-animation.css">
  <link rel="stylesheet" href="./embed.css">
  <script src="./embed.js"></script>
  <link rel="stylesheet" href="./draw-tool.css">
  <script src="./draw-tool.js" defer></script>
  <script src="./tool-back.js" data-position="top-right"></script>
</head>
<body>
  <header class="page-header">
    <h1>Maltose Condensation &amp; Hydrolysis</h1>
    <p>Step-by-step animation of disaccharide formation and breakdown.</p>
  </header>

  <main class="stage-shell">
    <div class="mode-toggle" role="tablist" aria-label="Reaction mode">
      <button type="button" class="active" id="mode-condensation" role="tab" aria-selected="true">Condensation</button>
      <button type="button" id="mode-hydrolysis" role="tab" aria-selected="false">Hydrolysis</button>
    </div>

    <div class="canvas-wrap" id="stage-root">
      <div id="maltose-stage" aria-label="Maltose condensation and hydrolysis animation"></div>
    </div>

    <div class="caption-bar" aria-live="polite">
      <p class="caption-text" id="caption-en">Loading…</p>
      <p class="caption-text zh" id="caption-zh"></p>
    </div>

    <div class="controls">
      <button type="button" class="primary" id="btn-play">▶ Play</button>
      <button type="button" id="btn-prev">◀ Prev</button>
      <button type="button" id="btn-next">Next ▶</button>
      <button type="button" id="btn-restart">↺ Restart</button>
      <div class="progress-wrap">
        <input type="range" id="progress" min="0" max="3" step="1" value="0" aria-label="Animation step">
        <span class="progress-label" id="progress-label">Step 1 / 4</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { MaltoseAnimation, MODES } from "./js/maltoseAnimation.js";

    const stage = document.getElementById("maltose-stage");
    const captionEn = document.getElementById("caption-en");
    const captionZh = document.getElementById("caption-zh");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnRestart = document.getElementById("btn-restart");
    const progress = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    const modeCond = document.getElementById("mode-condensation");
    const modeHydro = document.getElementById("mode-hydrolysis");

    const MODE_STRINGS = {
      en: { condensation: "Condensation", hydrolysis: "Hydrolysis" },
      zh: { condensation: "縮合反應", hydrolysis: "水解反應" },
      "zh-Hant": { condensation: "縮合反應", hydrolysis: "水解反應" },
    };

    function resolveLang() {
      try {
        const parentLang = window.parent.document.documentElement.lang;
        if (parentLang) return parentLang;
      } catch (_) { /* cross-origin */ }
      return document.documentElement.lang || "en";
    }

    function setCaption(step, index, mode) {
      captionEn.textContent = step.en;
      captionZh.textContent = step.zh;
      progress.value = String(index);
      const modeLabel = mode === "condensation" ? "Condensation" : "Hydrolysis";
      progressLabel.textContent = `${modeLabel} · Step ${index + 1} / 4`;
    }

    function setPlayLabel(playing) {
      btnPlay.textContent = playing ? "⏸ Pause" : "▶ Play";
    }

    function setModeButtons(mode) {
      modeCond.classList.toggle("active", mode === "condensation");
      modeHydro.classList.toggle("active", mode === "hydrolysis");
      modeCond.setAttribute("aria-selected", mode === "condensation" ? "true" : "false");
      modeHydro.setAttribute("aria-selected", mode === "hydrolysis" ? "true" : "false");
    }

    const anim = new MaltoseAnimation(stage, {
      onStep: (step, index, mode) => setCaption(step, index, mode),
      onComplete: () => setPlayLabel(false),
    });

    setPlayLabel(true);
    setCaption(MODES.condensation.steps[0], 0, "condensation");

    btnPlay.addEventListener("click", () => {
      anim.toggle();
      setPlayLabel(anim.playing);
    });
    btnPrev.addEventListener("click", () => {
      anim.prev();
      anim.pause();
      setPlayLabel(false);
      setCaption(anim.steps[anim.stepIndex], anim.stepIndex, anim.mode);
    });
    btnNext.addEventListener("click", () => {
      anim.next();
      anim.pause();
      setPlayLabel(false);
      setCaption(anim.steps[anim.stepIndex], anim.stepIndex, anim.mode);
    });
    btnRestart.addEventListener("click", () => {
      anim.restart();
      setPlayLabel(true);
      setCaption(anim.steps[0], 0, anim.mode);
    });
    progress.addEventListener("input", () => {
      anim.goToStep(Number(progress.value));
      anim.pause();
      setPlayLabel(false);
      setCaption(anim.steps[anim.stepIndex], anim.stepIndex, anim.mode);
    });

    function switchMode(mode) {
      anim.setMode(mode);
      setModeButtons(mode);
      setPlayLabel(true);
      setCaption(anim.steps[0], 0, mode);
    }

    modeCond.addEventListener("click", () => switchMode("condensation"));
    modeHydro.addEventListener("click", () => switchMode("hydrolysis"));

    const lang = resolveLang();
    const copy = MODE_STRINGS[lang] || MODE_STRINGS.en;
    modeCond.textContent = copy.condensation;
    modeHydro.textContent = copy.hydrolysis;
  </script>
</body>
</html>
