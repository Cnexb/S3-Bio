<!DOCTYPE html>
<html class="light" lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ch 5 Condensation &amp; Hydrolysis — Class Slides</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --sidebar-w:340px;
  --hud-h:2.75rem;
  --deck-vmin:1vmin;
  --deck-vmax:1vmax;
  --title-block:2.4rem;
  --zoom-max:1.45;
  --fs-title:clamp(1.1rem,calc(var(--deck-vmin)*2.8),3rem);
  --fs-sub:clamp(1rem,calc(var(--deck-vmin)*2.4),2.4rem);
  --fs-body:clamp(1rem,calc(var(--deck-vmin)*3.2),3.5rem);
  --fs-sm:clamp(.9rem,calc(var(--deck-vmin)*2.5),2.4rem);
  --fs-headline:clamp(1.5rem,calc(var(--deck-vmin)*5.5),5rem);
}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,sans-serif;background:#fff;color:#191c1e}
html{height:100dvh}
body{min-height:100dvh}
.app-shell{display:flex;height:100dvh;width:100%;min-height:0;transition:all .25s ease}
.app-shell.sidebar-hidden{--sidebar-w:0px}
.deck-sidebar{width:var(--sidebar-w);min-width:0;flex-shrink:0;background:#fff;border-right:1px solid rgba(193,198,213,.55);display:flex;flex-direction:column;z-index:60;overflow:hidden;transition:width .25s ease,opacity .2s ease;box-shadow:2px 0 14px rgba(0,0,0,.04)}
.app-shell.sidebar-hidden .deck-sidebar{opacity:0;pointer-events:none;border:none}
.deck-sidebar__head{padding:.55rem .75rem;border-bottom:1px solid rgba(193,198,213,.4);display:flex;align-items:center;justify-content:space-between;gap:.4rem;background:#f7f9fb;flex-shrink:0}
.deck-sidebar__head h2{font-size:.92rem;font-weight:700;color:#004e9f;margin:0}
.sidebar-toggle,.sidebar-fab{border:1px solid #c1c6d5;background:#fff;border-radius:.4rem;padding:.25rem .5rem;font-size:.8rem;font-weight:600;color:#004e9f;cursor:pointer}
.sidebar-fab{display:none;position:fixed;left:.45rem;top:50%;transform:translateY(-50%);z-index:70;padding:.4rem .5rem;border-radius:0 .45rem .45rem 0;box-shadow:2px 0 10px rgba(0,0,0,.1)}
.app-shell.sidebar-hidden .sidebar-fab{display:flex;align-items:center}
.deck-sidebar__nav{flex:1;overflow-y:auto;padding:.45rem .5rem}
.sidebar-item{display:flex;align-items:flex-start;gap:.55rem;width:100%;padding:.45rem .55rem;margin-bottom:.18rem;border:1px solid transparent;border-radius:.5rem;background:transparent;cursor:pointer;text-align:left}
.sidebar-item.is-active{background:rgba(0,78,159,.12);border-color:rgba(0,78,159,.35)}
.sidebar-num{width:1.65rem;font-size:.78rem;font-weight:800;color:#004e9f;text-align:center;flex-shrink:0;padding-top:.15rem}
.sidebar-thumb{width:3.4rem;height:2.15rem;border-radius:.32rem;overflow:hidden;background:#eef2f6;border:1px solid rgba(193,198,213,.5);flex-shrink:0}
.sidebar-thumb img{width:100%;height:100%;object-fit:cover}
.sidebar-label{flex:1;min-width:0;font-size:.78rem;line-height:1.35;color:#414753;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.deck-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.deck{position:relative;flex:1;min-height:0;width:100%;background:#fff}
.deck-slide{position:absolute;inset:0;background:#fff;display:none;overflow:hidden;box-sizing:border-box}
.deck-slide.active{display:flex;flex-direction:column;align-items:stretch;justify-content:center;z-index:2}
.deck-slide .frame{flex:1;min-height:0;min-width:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center center;background:#fff;display:none;box-sizing:border-box}
.deck-slide .frame.is-active{display:block}
.deck-slide .frame-embed{flex:1;min-height:0;min-width:0;width:100%;height:100%;border:0;background:#fff;display:none}
.deck-slide .frame-embed.is-active{display:block}
/* Rich slides from ch5-food-human-summer */
.deck-slide--rich{padding:.35rem .85rem 0;display:none;flex-direction:column;overflow:hidden;box-sizing:border-box}
.deck-slide--rich.active{display:flex}
.deck-slide--rich .deck-slide__inner{max-width:min(1600px,100%);width:100%;margin:0 auto;flex:1;min-height:0;min-width:0;height:100%;display:flex;flex-direction:column;transform-origin:center center}
.deck-slide--rich .deck-slide__body{flex:1;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;height:100%}
.deck-slide--rich.deck-slide--center .deck-slide__inner,.deck-slide--rich.deck-slide--center .deck-slide__body{justify-content:center;align-items:center}
.deck-slide__title{font-size:var(--fs-title)!important;font-weight:800;line-height:1.1;flex-shrink:0;margin:0 0 .2rem;color:#004e9f}
.deck-text{font-size:var(--fs-body)!important;line-height:1.38;color:#191c1e;overflow-wrap:anywhere}
.deck-text-sm{font-size:var(--fs-sm)!important;line-height:1.34;color:#191c1e;overflow-wrap:anywhere}
.ans-green{display:inline-block;max-width:100%;padding:.45rem .85rem;border-radius:.45rem;background:#bbf7d0;color:#14532d;font-weight:700;box-shadow:0 0 0 2px #86efac;font-size:var(--fs-sm)!important;overflow-wrap:anywhere}
.font-headline-xl{font-size:var(--fs-headline)!important;line-height:1.1!important;font-weight:800}
.layout-fig-top{display:flex;flex-direction:column;height:100%;gap:.35rem;min-height:0;min-width:0;overflow:hidden;flex:1}
.layout-fig-top__media{flex:1.25;min-height:0;min-width:0;max-height:68%;display:flex;flex-direction:column;overflow:hidden}
.layout-fig-top__media .fig-box{flex:1;height:100%;display:flex;flex-direction:column;min-height:0;margin:0;padding:.25rem .4rem;border-radius:.55rem;background:#fff;border:1px solid rgba(193,198,213,.45)}
.layout-fig-top__media img{width:100%;flex:1;min-height:0;object-fit:contain;max-height:100%!important;background:#f7f9fb;border-radius:.35rem}
.layout-fig-top__text{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:.2rem;overflow:hidden}
@media (min-width:760px) and (min-height:380px){
  .deck-slide--rich .layout-fig-top{flex-direction:row;align-items:stretch;gap:.55rem}
  .deck-slide--rich .layout-fig-top__media{flex:1.05;max-height:100%}
  .deck-slide--rich .layout-fig-top__text{flex:1;justify-content:center}
}
@media (min-width:1400px) and (min-height:800px){
  :root{--zoom-max:1.65;--fs-body:clamp(1.15rem,calc(var(--deck-vmin)*3.5),4rem);--fs-sm:clamp(1rem,calc(var(--deck-vmin)*2.8),2.8rem);--fs-title:clamp(1.25rem,calc(var(--deck-vmin)*3.1),3.5rem);--fs-headline:clamp(1.75rem,calc(var(--deck-vmin)*6.2),5.5rem)}
}
@media (min-width:1800px) and (min-height:950px){
  :root{--zoom-max:1.85;--fs-body:clamp(1.3rem,calc(var(--deck-vmin)*3.8),4.5rem);--fs-headline:clamp(2rem,calc(var(--deck-vmin)*6.8),6rem)}
}
@media (max-width:640px){
  :root{--sidebar-w:min(88vw,300px);--zoom-max:1.2}
  .deck-slide--rich{padding:.25rem .5rem 0}
  .layout-fig-top__media{max-height:52%}
}
.deck-slide--rich.deck-slide--scroll .deck-slide__body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.deck-slide--rich.deck-slide--scroll .deck-slide__inner{height:auto;max-height:100%}
.worksheet-stack{display:flex;flex-direction:column;gap:.45rem;padding:.15rem 0 .35rem;min-height:min-content}
.worksheet-stack__item{margin:0;padding:.2rem .35rem;border-radius:.45rem;background:#f7f9fb;border:1px solid rgba(193,198,213,.45)}
.worksheet-stack__item img{width:100%;height:auto;object-fit:contain;display:block;border-radius:.3rem;background:#fff}
@media (max-height:520px){
  :root{--zoom-max:1.1;--fs-body:clamp(.88rem,calc(var(--deck-vmin)*2.6),1.4rem);--fs-sm:clamp(.82rem,calc(var(--deck-vmin)*2.2),1.15rem);--fs-title:clamp(.95rem,calc(var(--deck-vmin)*2.3),1.3rem);--fs-headline:clamp(1.2rem,calc(var(--deck-vmin)*4),2.2rem)}
  .layout-fig-top__media{max-height:46%}
}
.step{opacity:0;transform:translateY(4px);transition:none}
.step.shown{opacity:1;transform:none}
.step-pic{opacity:1;transform:none}
.hidden-answer,.hidden-explain{display:none}
.hidden-answer.shown,.hidden-explain.shown{display:block}
.fill-blank.hidden-answer{display:none}
.fill-blank.shown{display:inline;background:#bbf7d0;color:#14532d;font-weight:700;padding:.06rem .35rem;border-radius:.2rem;font-size:var(--fs-body)!important}
.fill-dash{display:inline}
.fill-dash:not(.shown){display:none}
.mcq-list{margin:0;padding-left:1.2rem;list-style:none}
.mcq-list li{margin-bottom:.28rem;line-height:1.4;font-size:var(--fs-body)!important}
.mcq-opt.correct-answer{background:#bbf7d0!important;border-radius:.4rem;padding:.3rem .55rem;margin-left:-.55rem;font-weight:700}
.answer-badge{display:inline-block;padding:.4rem .9rem;border-radius:999px;background:#006d37;color:#fff;font-weight:700;font-size:var(--fs-sm)}
.answer-badge--sm{font-size:var(--fs-sm);padding:.3rem .65rem}
.tf-item--border{border-bottom:1px solid rgba(193,198,213,.28);padding-bottom:.45rem;margin-bottom:.45rem}
.tf-q{margin-bottom:.2rem!important;line-height:1.38!important}
.word-bank{display:flex;flex-wrap:wrap;gap:.35rem}
.bio-tag{display:inline-block;padding:.2rem .55rem;border-radius:999px;background:rgba(0,78,159,.1);color:#004e9f;font-size:var(--fs-sm);font-weight:600}
.deck-subtitle{font-size:var(--fs-sub)!important;color:#004e9f;font-weight:700}
.text-primary{color:#004e9f}
.fig-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
@media(max-width:760px){.fig-grid-2{grid-template-columns:1fr}}
.hl{display:inline;padding:.06em .2em;border-radius:.16em;font-weight:700}
.hl-b.shown{background:#bfdbfe;color:#1e3a8a;box-shadow:0 0 0 2px #93c5fd}
.hl-u.shown{background:#fef08a;color:#713f12;box-shadow:0 0 0 2px #fde047}
.hl-c.shown{background:#bbf7d0;color:#14532d;box-shadow:0 0 0 2px #86efac}
.text-center{text-align:center}
.sidebar-thumb-ph{font-size:.6rem;font-weight:700;color:#414753;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.deck-hud{position:relative;flex-shrink:0;z-index:50;min-height:var(--hud-h);display:flex;align-items:center;gap:.45rem;padding:0 .65rem calc(.35rem + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:1px solid rgba(193,198,213,.5);font-size:.75rem;color:#414753;box-sizing:border-box;overflow:hidden}
.draw-tool-fab{bottom:calc(var(--hud-h) + max(.65rem,env(safe-area-inset-bottom,0px)) + .5rem)!important}
.draw-tool-toolbar{bottom:calc(var(--hud-h) + max(.65rem,env(safe-area-inset-bottom,0px)) + 4.15rem)!important}
.deck-hud button{border:1px solid #c1c6d5;background:#fff;border-radius:999px;padding:.32rem .75rem;font-weight:600;font-size:.75rem;color:#004e9f;cursor:pointer}
.deck-progress{flex:1;max-width:160px;height:5px;background:rgba(0,78,159,.12);border-radius:999px;overflow:hidden}
.deck-progress>div{height:100%;background:#004e9f;transition:width .3s}
#hud-label{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media print{.deck-hud,.deck-sidebar,.sidebar-fab,.draw-tool-fab,.draw-tool-toolbar,#drawCanvas{display:none!important}}
</style>

</head>
<body>
<div class="app-shell" id="shell">
<aside class="deck-sidebar" id="sidebar">
<div class="deck-sidebar__head"><h2>Pages · 頁面</h2><div><span id="page-count">…</span> <button type="button" id="btn-sidebar-close" class="sidebar-toggle" title="Hide sidebar (B)">✕</button></div></div>
<nav class="deck-sidebar__nav" id="sidebar-nav"></nav>
</aside>
<button type="button" id="btn-sidebar-open" class="sidebar-fab" title="Show sidebar (B)">☰</button>
<div class="deck-main">
<div class="deck" id="deck"></div>
<div class="deck-hud">
<button type="button" id="btn-hub" hidden>← Slides</button>
<button type="button" id="btn-sidebar-hud" title="Toggle sidebar (B)">☰</button>
<button type="button" id="btn-prev">← Prev</button>
<div class="deck-progress"><div id="progress-bar" style="width:0"></div></div>
<span id="hud-label">Loading…</span>
<button type="button" id="btn-next">Next →</button>
</div>
</div>
</div>
<script>
(async function(){
  const deckEl=document.getElementById("deck");
  const shell=document.getElementById("shell");
  const navEl=document.getElementById("sidebar-nav");
  function resolveAssetBase(){
    const parts=location.pathname.split("/").filter(Boolean);
    const osmosisIdx=parts.indexOf("osmosis");
    const prefixParts=osmosisIdx>0?parts.slice(0,osmosisIdx).filter(p=>p!=="public"):[];
    const prefix=prefixParts.length?"/"+prefixParts.join("/"):"";
    return prefix+"/slides/ch5-condensation-hydrolysis/public";
  }
  const ASSET_BASE=resolveAssetBase();
  const FH_IMG="./embed/ch5fh-assets/image1.png";
  const DECK_VERSION=Date.now();
  const EMBED_URLS={
    maltose:"../../food-nutrition/ch5/maltose-condensation/index.html",
    "maltose-hydrolysis":"../../food-nutrition/ch5/maltose-hydrolysis/index.html",
    "starch-hydrolysis":"../../food-nutrition/ch5/starch-hydrolysis/index.html",
    "cellulose-hydrolysis":"../../food-nutrition/ch5/cellulose-hydrolysis/index.html",
    triglyceride:"../../food-nutrition/ch5/triglyceride-condensation/index.html",
    dipeptide:"../../food-nutrition/ch5/dipeptide-condensation/index.html",
    "protein-fold":"./embed/protein-fold.html"
  };
  const REVEAL_EMBEDS=new Set(["maltose","maltose-hydrolysis","starch-hydrolysis","cellulose-hydrolysis","triglyceride","dipeptide"]);
  const revealBound=new WeakSet();

  const PREFIX_SLIDES=[
    {
      type:"rich",
      label:"Organic 有機 & Inorganic 無機",
      thumbPh:"Or",
      center:true,
      html:`<div class="deck-slide__inner"><h2 class="deck-slide__title">Organic 有機 &amp; Inorganic 無機</h2><div class="deck-slide__body"><h2 class="font-headline-xl text-center"><span class="hl hl-b step step-text">Organic 有機 &amp; Inorganic 無機</span></h2></div></div>`
    },
    {
      type:"rich",
      label:"「Organic products」有機產品",
      thumb:FH_IMG,
      html:`<div class="deck-slide__inner"><h2 class="deck-slide__title">「Organic products」有機產品</h2><div class="deck-slide__body"><div class="layout-fig-top"><div class="layout-fig-top__media"><figure class="fig-box fig-wide step step-pic"><img src="${FH_IMG}" alt="Organic products"/></figure></div><div class="layout-fig-top__text"><p class="deck-text step step-text"><span class="hl hl-u step step-text">&quot;Organic products&quot;</span></p><p class="deck-text step step-text">Food produced under the rules of <span class="hl hl-c step step-text">organic farming 有機農業</span>,</p><p class="deck-text step step-text">e.g. without artificial fertilizers</p></div></div></div></div>`
    }
  ];

  function waitReveal(iframe,cb,left=120){
    if(left<=0){cb(null);return;}
    const R=iframe.contentWindow?.Reveal;
    if(R&&R.isReady&&R.isReady()){cb(R);return;}
    setTimeout(()=>waitReveal(iframe,cb,left-1),80);
  }

  function bindReveal(iframe){
    if(revealBound.has(iframe))return;
    revealBound.add(iframe);
    const boot=()=>waitReveal(iframe,R=>{if(R)R.layout?.();});
    iframe.addEventListener("load",boot);
    if(iframe.dataset.loaded==="1")boot();
  }

  function syncReveal(iframe,step){
    waitReveal(iframe,R=>{
      if(!R)return;
      R.slide(Math.max(0,Math.min(step,4)));
      R.layout?.();
    });
  }

  const deckUrl=`${ASSET_BASE}/data/deck-pages.json?v=${Date.now()}`;
  const res=await fetch(deckUrl,{cache:"no-store"});
  if(!res.ok)throw new Error(`deck-pages.json ${res.status} @ ${deckUrl}`);
  const data=await res.json();
  if(!Array.isArray(data.pages)||!data.pages.length)throw new Error(`deck-pages.json has no pages @ ${deckUrl}`);
  const pages=[...PREFIX_SLIDES,...data.pages.map(p=>({...p,type:p.type||"deck"}))];
  document.getElementById("page-count").textContent=pages.length;

  function normalizeFrames(page){
    if(page.frameMeta&&page.frameMeta.length)return page.frameMeta;
    return page.frames.map(f=>{
      if(typeof f==="string"&&f.startsWith("anim:")){
        const parts=f.split(":");
        return{type:"animation",embed:parts[1],step:+parts[2]||0};
      }
      return{type:"image",src:f};
    });
  }

  function ensureEmbedSrc(iframe,embed){
    if(!iframe||!embed)return;
    let url=EMBED_URLS[embed]||"";
    if(iframe.dataset.loaded==="1")return;
    if(url)url+=(url.includes("?")?"&":"?")+"v="+DECK_VERSION;
    iframe.src=url;
    iframe.dataset.loaded="1";
    if(REVEAL_EMBEDS.has(embed))bindReveal(iframe);
  }

  function syncEmbed(iframe,meta){
    if(!iframe||!meta)return;
    const step=meta.step??0;
    if(REVEAL_EMBEDS.has(meta.embed)){
      syncReveal(iframe,step);
      setTimeout(()=>syncReveal(iframe,step),400);
      setTimeout(()=>syncReveal(iframe,step),1200);
      return;
    }
    const action=meta.embed==="protein-fold"?"restart":"go";
    const send=(act,payload)=>{
      try{iframe.contentWindow?.postMessage({type:"ch5-embed",action:act,...payload},"*");}
      catch(e){}
    };
    send(action,{step});
    setTimeout(()=>send(action,{step}),300);
  }

  function sidebarThumb(page,displayNum){
    if(page.thumb&&page.thumb.startsWith("./"))return `<img src="${page.thumb}" alt="" loading="lazy"/>`;
    if(page.thumbPh)return `<span class="sidebar-thumb-ph">${page.thumbPh}</span>`;
    if(page.thumb)return `<img src="${ASSET_BASE+page.thumb}" alt="" loading="lazy"/>`;
    return `<span class="sidebar-thumb-ph">${(page.label||"Pg").slice(0,2)}</span>`;
  }

  pages.forEach((page,idx)=>{
    const sec=document.createElement("section");
    sec.dataset.index=String(idx);
    sec.id=`slide-${idx}`;
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="sidebar-item";
    btn.dataset.goto=String(idx);
    btn.innerHTML=`<span class="sidebar-num">${idx+1}</span><span class="sidebar-thumb">${sidebarThumb(page,idx+1)}</span><span class="sidebar-label">${page.label||("Page "+(idx+1))}</span>`;
    btn.title=page.label||("");
    navEl.appendChild(btn);

    if(page.type==="rich"){
      sec.className="deck-slide deck-slide--rich"+(page.center?" deck-slide--center":"")+(page.scroll?" deck-slide--scroll":"");
      if(page.phases)sec.dataset.phases=page.phases;
      sec.innerHTML=page.html;
      deckEl.appendChild(sec);
      return;
    }

    const meta=normalizeFrames(page);
    sec.className="deck-slide";
    const embedIframes=new Map();
    meta.forEach((fr,fi)=>{
      if(fr.type==="image"){
        const img=document.createElement("img");
        img.className="frame"+(fi===0?" is-active":"");
        img.dataset.frameIndex=String(fi);
        img.src=ASSET_BASE+fr.src;
        img.alt=page.label||`Page ${page.page}`;
        img.decoding="async";
        img.draggable=false;
        img.addEventListener("load",()=>{if(+sec.dataset.index===pi)onViewportChange();});
        sec.appendChild(img);
      }else if(fr.type==="animation"){
        let iframe=embedIframes.get(fr.embed);
        if(!iframe){
          iframe=document.createElement("iframe");
          iframe.className="frame-embed";
          iframe.dataset.embed=fr.embed;
          iframe.title=fr.embed;
          iframe.allow="autoplay; fullscreen; encrypted-media";
          sec.appendChild(iframe);
          embedIframes.set(fr.embed,iframe);
        }
      }
    });
    page._meta=meta;
    deckEl.appendChild(sec);
  });

  const slides=[...document.querySelectorAll(".deck-slide")];
  const sidebarItems=[...document.querySelectorAll(".sidebar-item")];
  let pi=0,stepIdx=0;

  const phaseLabels={pic:"Picture 圖片",q:"Question 題目",a:"Answer 答案",e:"Explanation 解釋"};

  function getPhases(sl){const p=(sl?.dataset.phases||"").trim();return p?p.split(","):null;}
  function hasPhases(i){return !!getPhases(slides[i]);}
  function isRich(i){return pages[i]?.type==="rich";}
  function metaFor(i){return pages[i]._meta||normalizeFrames(pages[i]);}
  function seqSteps(sl){
    const all=[...sl.querySelectorAll(".step:not([data-phase])")];
    const pics=all.filter(el=>el.classList.contains("step-pic"));
    const text=all.filter(el=>el.classList.contains("step-text"));
    const rest=all.filter(el=>!el.classList.contains("step-pic")&&!el.classList.contains("step-text"));
    return[...pics,...text,...rest];
  }
  function richStepCount(i){
    const phases=getPhases(slides[i]);
    if(phases)return phases.length;
    return Math.max(seqSteps(slides[i]).length,1);
  }
  function deckStepCount(i){return metaFor(i).length;}
  function stepCount(i){return isRich(i)?richStepCount(i):deckStepCount(i);}
  function maxSteps(i){return Math.max(stepCount(i)-1,0);}

  function slideContentBox(sl){
    const cs=getComputedStyle(sl);
    const padT=parseFloat(cs.paddingTop)||0;
    const padR=parseFloat(cs.paddingRight)||0;
    const padB=parseFloat(cs.paddingBottom)||0;
    const padL=parseFloat(cs.paddingLeft)||0;
    return{
      w:Math.max(80,sl.clientWidth-padL-padR-10),
      h:Math.max(60,sl.clientHeight-padT-padB-10)
    };
  }

  const ZOOM_EPS=.02;
  const FIT_DEBOUNCE_MS=100;
  let lastZoomBySlide=new WeakMap();
  let lastDeckVmin=null,lastDeckVmax=null,lastHudH=null;
  let fitTimer=null,fitRaf=null,fitInProgress=false,slideFitObserver=null;

  function roundZoom(z){return Math.round(z*100)/100;}

  function syncDeckMetrics(){
    const deck=document.getElementById("deck");
    if(!deck)return;
    const r=deck.getBoundingClientRect();
    const vmin=Math.round(Math.min(r.width,r.height)/100*100)/100;
    const vmax=Math.round(Math.max(r.width,r.height)/100*100)/100;
    if(lastDeckVmin!==null&&Math.abs(vmin-lastDeckVmin)<.5&&Math.abs(vmax-lastDeckVmax)<.5)return;
    lastDeckVmin=vmin;lastDeckVmax=vmax;
    document.documentElement.style.setProperty("--deck-vmin",vmin+"px");
    document.documentElement.style.setProperty("--deck-vmax",vmax+"px");
  }

  function fitSlide(){
    if(fitInProgress)return;
    fitInProgress=true;
    if(slideFitObserver)slideFitObserver.disconnect();
    slides.forEach((s,i)=>{
      if(i===pi)return;
      const inner=s.querySelector(".deck-slide__inner");
      if(inner&&inner.style.zoom!=="1"){
        inner.style.zoom="1";
        lastZoomBySlide.delete(inner);
      }
    });
    const sl=slides[pi];
    if(!sl||!isRich(pi)||pages[pi]?.scroll){
      fitInProgress=false;
      observeActiveSlide();
      return;
    }
    const inner=sl.querySelector(".deck-slide__inner");
    if(!inner){
      fitInProgress=false;
      observeActiveSlide();
      return;
    }
    const prevZoom=lastZoomBySlide.get(inner)??1;
    const measure=()=>{
      inner.style.zoom="1";
      const {w:maxW,h:maxH}=slideContentBox(sl);
      const w=inner.scrollWidth||inner.offsetWidth;
      const h=inner.scrollHeight||inner.offsetHeight;
      if(!w||!h||maxW<40||maxH<40){
        fitInProgress=false;
        observeActiveSlide();
        return;
      }
      const zoomMax=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--zoom-max"))||1.45;
      const zoomMin=.42;
      const scaleW=maxW/w;
      const scaleH=maxH/h;
      let scale=Math.min(scaleW,scaleH);
      const fill=Math.max(w/maxW,h/maxH);
      if(scale<1){
        scale=Math.max(zoomMin,scale);
      }else if(fill<.76||(fill<.80&&prevZoom>1)){
        scale=Math.min(zoomMax,scale);
      }else if(fill>.82||(fill>.78&&prevZoom<=1)){
        scale=1;
      }else{
        scale=prevZoom;
      }
      const rounded=roundZoom(scale);
      if(Math.abs(rounded-prevZoom)>ZOOM_EPS){
        inner.style.zoom=String(rounded);
        lastZoomBySlide.set(inner,rounded);
      }else if(prevZoom!==1){
        inner.style.zoom=String(prevZoom);
      }
      fitInProgress=false;
      observeActiveSlide();
    };
    requestAnimationFrame(()=>requestAnimationFrame(measure));
  }

  function layoutEmbeds(){
    const sl=slides[pi];
    if(!sl)return;
    sl.querySelectorAll(".frame-embed.is-active").forEach(iframe=>{
      waitReveal(iframe,R=>R?.layout?.());
      try{iframe.contentWindow?.postMessage({type:"ch5-embed",action:"layout"},"*");}
      catch(e){}
    });
  }

  function syncHudChrome(){
    const hud=document.querySelector(".deck-hud");
    if(!hud)return;
    const h=Math.ceil(hud.getBoundingClientRect().height);
    if(h<=0)return;
    if(lastHudH!==null&&Math.abs(h-lastHudH)<2)return;
    lastHudH=h;
    document.documentElement.style.setProperty("--hud-h",h+"px");
  }

  function onViewportChange(){
    syncHudChrome();
    syncDeckMetrics();
    fitSlide();
    layoutEmbeds();
  }

  function observeActiveSlide(){
    if(slideFitObserver)slideFitObserver.disconnect();
    if(!window.ResizeObserver||fitInProgress)return;
    const sl=slides[pi];
    if(!sl||!isRich(pi)||pages[pi]?.scroll)return;
    slideFitObserver=new ResizeObserver(()=>scheduleFit());
    slideFitObserver.observe(sl);
  }

  function scheduleFit(){
    if(fitInProgress)return;
    if(fitTimer)clearTimeout(fitTimer);
    if(fitRaf){cancelAnimationFrame(fitRaf);fitRaf=null;}
    fitRaf=requestAnimationFrame(()=>{
      fitRaf=null;
      fitTimer=setTimeout(()=>{
        fitTimer=null;
        onViewportChange();
      },FIT_DEBOUNCE_MS);
    });
  }

  function refreshRich(sl){
    const phases=getPhases(sl);
    if(phases){
      sl.querySelectorAll("[data-phase]").forEach(el=>{
        const p=el.dataset.phase;
        const show=phases.indexOf(p)<=stepIdx;
        el.classList.toggle("shown",show);
        if(el.classList.contains("hidden-answer"))el.classList.toggle("shown",show&&p==="a");
        if(el.classList.contains("hidden-explain"))el.classList.toggle("shown",show&&p==="e");
      });
      sl.querySelectorAll(".fill-blank").forEach(el=>el.classList.toggle("shown",stepIdx>=phases.indexOf("a")));
      sl.querySelectorAll(".fill-dash").forEach(el=>el.classList.toggle("shown",stepIdx<phases.indexOf("a")));
      const ap=sl.querySelector('.answer-panel[data-phase="a"]');
      if(ap&&phases.indexOf("a")<=stepIdx){
        const key=ap.dataset.answer;
        if(key)sl.querySelectorAll(".mcq-opt").forEach(li=>li.classList.toggle("correct-answer",li.dataset.key===key));
      }else{
        sl.querySelectorAll(".mcq-opt").forEach(li=>li.classList.remove("correct-answer"));
      }
    }else{
      const st=seqSteps(sl);
      st.forEach((el,i)=>{
        el.classList.toggle("shown",i<=stepIdx);
        if(el.classList.contains("hl"))el.classList.toggle("shown",i<=stepIdx);
      });
    }
    scheduleFit();
  }

  function toggleSidebar(force){
    const hide=force===undefined?!shell.classList.contains("sidebar-hidden"):!force;
    shell.classList.toggle("sidebar-hidden",hide);
    try{localStorage.setItem("ch5-sidebar-hidden",hide?"1":"0");}catch(e){}
    setTimeout(onViewportChange,280);
  }

  function updateSidebar(){
    sidebarItems.forEach((btn,i)=>{
      btn.classList.toggle("is-active",i===pi);
      if(i===pi)btn.scrollIntoView({block:"nearest"});
    });
  }

  function refresh(){
    const page=pages[pi];
    slides.forEach((s,i)=>s.classList.toggle("active",i===pi));

    if(isRich(pi)){
      refreshRich(slides[pi]);
    }else{
      const meta=metaFor(pi);
      const fr=meta[stepIdx];
      const sl=slides[pi];
      sl.querySelectorAll(".frame").forEach(img=>{
        const fi=+img.dataset.frameIndex;
        img.classList.toggle("is-active",fr&&fr.type==="image"&&fi===stepIdx);
      });
      sl.querySelectorAll(".frame-embed").forEach(iframe=>{
        const show=fr&&fr.type==="animation"&&iframe.dataset.embed===fr.embed;
        iframe.classList.toggle("is-active",show);
        if(show){ensureEmbedSrc(iframe,fr.embed);syncEmbed(iframe,fr);}
      });
    }

    let done=0,all=0;
    pages.forEach((p,i)=>{
      const n=stepCount(i);
      all+=n;
      if(i<pi)done+=n;
      else if(i===pi)done+=stepIdx+1;
    });
    document.getElementById("progress-bar").style.width=(done/all*100)+"%";
    const hud=document.getElementById("hud-label");
    if(isRich(pi)&&hasPhases(pi)){
      const phases=getPhases(slides[pi]);
      hud.textContent=`${pi+1} / ${pages.length} · ${page.label||""} · ${phaseLabels[phases[stepIdx]]||"Done"}`;
    }else{
      hud.textContent=`${pi+1} / ${pages.length} · ${page.label||""} · step ${stepIdx+1}/${stepCount(pi)}`;
    }
    updateSidebar();
    observeActiveSlide();
    scheduleFit();
  }

  function goPage(n){
    if(n<0||n>=pages.length)return;
    pi=n;stepIdx=0;refresh();
  }
  function next(){
    if(stepIdx<maxSteps(pi)){stepIdx++;refresh();return;}
    if(pi<pages.length-1)goPage(pi+1);
  }
  function prev(){
    if(stepIdx>0){stepIdx--;refresh();return;}
    if(pi>0){goPage(pi-1);stepIdx=maxSteps(pi);refresh();}
  }

  document.getElementById("btn-next").onclick=next;
  document.getElementById("btn-prev").onclick=prev;
  document.getElementById("btn-sidebar-hud").onclick=()=>toggleSidebar();
  document.getElementById("btn-sidebar-close").onclick=()=>toggleSidebar(false);
  document.getElementById("btn-sidebar-open").onclick=()=>toggleSidebar(true);
  sidebarItems.forEach(btn=>btn.addEventListener("click",()=>goPage(+btn.dataset.goto)));
  const hubBtn=document.getElementById("btn-hub");
  if(hubBtn&&window.self===window.top){hubBtn.hidden=false;hubBtn.onclick=()=>{window.location.href="../slides.html";};}
  try{if(localStorage.getItem("ch5-sidebar-hidden")==="1")shell.classList.add("sidebar-hidden");}catch(e){}
  document.addEventListener("keydown",e=>{
    if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next();}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
    else if(e.key==="Home"){e.preventDefault();goPage(0);}
    else if(e.key==="End"){e.preventDefault();goPage(pages.length-1);}
    else if(e.key==="b"||e.key==="B"){e.preventDefault();toggleSidebar();}
    else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();}
  });
  deckEl.addEventListener("click",e=>{
    if(e.target.closest("button,.draw-tool-fab,.draw-tool-toolbar,.deck-sidebar,.sidebar-fab,.frame-embed"))return;
    if(e.clientX>window.innerWidth*.62)next();else if(e.clientX<window.innerWidth*.38)prev();
  });
  const deckMain=document.querySelector(".deck-main");
  const deckHud=document.querySelector(".deck-hud");
  if(deckMain&&window.ResizeObserver){
    const ro=new ResizeObserver(()=>scheduleFit());
    ro.observe(deckMain);
    if(deckHud)ro.observe(deckHud);
    const deck=document.getElementById("deck");
    if(deck)ro.observe(deck);
  }
  window.addEventListener("resize",scheduleFit);
  window.addEventListener("orientationchange",()=>setTimeout(onViewportChange,120));
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",scheduleFit);
    window.visualViewport.addEventListener("scroll",scheduleFit);
  }
  const q=parseInt(new URLSearchParams(location.search).get("page"),10);
  goPage(Number.isFinite(q)&&q>=1&&q<=pages.length?q-1:0);
})().catch(err=>{
  console.error("[ch5-play] deck load failed:",err);
  const msg=err&&err.message?err.message:"Failed to load deck-pages.json";
  document.getElementById("page-count").textContent="!";
  document.getElementById("hud-label").textContent="Deck load failed — see console";
  const deck=document.getElementById("deck");
  if(deck)deck.innerHTML=`<div style="padding:2rem;font-family:Inter,sans-serif;color:#b91c1c"><p><strong>無法載入投影片資料</strong></p><p style="font-size:.9rem;color:#414753">請確認網址正確，或稍後再試。</p><p style="font-size:.75rem;color:#6b7280;margin-top:1rem">${msg}</p></div>`;
});
</script>
<script src="../../draw-tool.js"></script>
</body>
</html>
