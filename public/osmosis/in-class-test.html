<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>In Class Test</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        background: "#f7f9fb", secondary: "#006d37", "tertiary-fixed": "#ffdad7",
        primary: "#004e9f", "outline-variant": "#c1c6d5", "on-secondary": "#ffffff",
        "tertiary-container": "#c9242c", "primary-fixed": "#d7e3ff",
        "on-background": "#191c1e", "surface-variant": "#e0e3e5",
        surface: "#f7f9fb", "on-surface-variant": "#414753", "on-surface": "#191c1e",
        "surface-container-low": "#f2f4f6", "surface-container-lowest": "#ffffff",
        "surface-container-high": "#e6e8ea", "on-primary": "#ffffff", tertiary: "#a50018",
        "primary-container": "#0066cc", "on-primary-container": "#dfe8ff",
        outline: "#727784", "secondary-fixed-dim": "#4ae183"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { "container-max": "1200px" },
      fontFamily: {
        "headline-lg": ["Inter", "sans-serif"], "body-md": ["Inter", "sans-serif"], "label-bold": ["Inter", "sans-serif"], "body-sm": ["Inter", "sans-serif"],
        "headline-lg-mobile": ["Inter", "sans-serif"]
      },
      fontSize: {
        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
        "body-md": ["16px", { lineHeight: "24px" }],
        "body-sm": ["14px", { lineHeight: "20px" }],
        "label-bold": ["14px", { lineHeight: "18px", fontWeight: "600" }]
      }
    }
  }
};
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.shiny-progress-bar::after {
  content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shine 2s infinite;
}
@keyframes shine { 100% { left: 100%; } }
.split-word { display: inline-block; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal .split-word { opacity: 1; transform: translateY(0); }
.magnet-link { transition: transform 0.2s ease-out; }
.true-focus-active .focus-target { filter: blur(0); opacity: 1; z-index: 10; }
.true-focus-active .focus-dim { filter: blur(8px); opacity: 0.4; pointer-events: none; }
.q-block { opacity: 0; transform: translateY(1rem); transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1); }
.q-block.q-visible { opacity: 1; transform: translateY(0); }
.quiz-fig img { display: block; width: 100%; max-height: 220px; object-fit: contain; border-radius: 0.75rem; background: #f7f9fb; }
.summary-panel[hidden] { display: none !important; }
#settings-panel { transition: opacity 0.35s ease, transform 0.35s ease; }
#quiz-layout.settings-collapsed #settings-panel { display: none; }
#quiz-layout.settings-collapsed { grid-template-columns: 1fr !important; }
.settings-toggle-btn { transition: transform 0.2s, border-color 0.2s; }
.settings-toggle-btn:hover { transform: scale(1.02); }
#quiz-pdf-sheet { display: none; }
.quiz-settings-header .bio-tool-back-wrap--inline { margin: 0; flex-shrink: 0; }
.quiz-settings-header .bio-tool-back-btn { font-size: 0.75rem; padding: 6px 12px 6px 10px; }
@media print {
  body * { visibility: hidden; }
  #quiz-pdf-sheet, #quiz-pdf-sheet * { visibility: visible; }
  #quiz-pdf-sheet { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 1rem; }
  #settings-panel { display: none !important; }
}
</style>
<link href="./embed.css" rel="stylesheet"/>
<script src="./embed.js"></script>
<link href="./draw-tool.css" rel="stylesheet"/>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen selection:bg-primary-fixed">

<main class="max-w-container-max mx-auto px-4 md:px-6 py-4 md:py-6 pb-12 grid grid-cols-1 lg:grid-cols-[minmax(240px,300px)_1fr] gap-6 items-start" id="quiz-layout">

<aside class="bg-surface-container-lowest p-6 rounded-3xl border border-outline-variant/30 shadow-lg lg:sticky lg:top-2" id="settings-panel">
<div class="quiz-settings-header flex flex-wrap items-center justify-between gap-3 mb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface" data-i18n="hExport">Export</h2>
</div>
<p class="text-body-sm text-on-surface-variant mb-4" data-i18n="fixedInfo">Fixed MCQ in chapter order.</p>
<p class="text-body-sm text-on-surface-variant mb-4" data-i18n="txtExportHint">Word: .doc for Microsoft Word. Use Print → Save as PDF for a PDF copy.</p>
<div class="flex flex-col gap-2">
<button class="py-2.5 px-4 rounded-xl border border-outline-variant/40 bg-surface font-label-bold text-body-sm hover:bg-surface-container-low" id="btn-doc-q" type="button" data-i18n="btnDocQ">Word — Questions</button>
<button class="py-2.5 px-4 rounded-xl border border-outline-variant/40 bg-surface font-label-bold text-body-sm hover:bg-surface-container-low" id="btn-doc-a" type="button" data-i18n="btnDocA">Word — Answers</button>
<button class="py-2.5 px-4 rounded-xl border border-outline-variant/40 bg-surface font-label-bold text-body-sm hover:bg-surface-container-low" id="btn-print" type="button" data-i18n="btnPrint">Print / Save as PDF</button>
</div>
</aside>

<div class="min-w-0 space-y-4">
<div id="in-class-test-back-bar" class="flex flex-wrap items-center gap-3">
<div id="bio-tool-back-slot"></div>
</div>
<div class="flex flex-wrap items-center justify-between gap-3 focus-dim">
<div class="min-w-0 flex-1">
<p class="font-label-bold text-primary text-body-sm mb-1" id="quiz-chapter-label">CH · IN CLASS TEST</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1" id="quiz-chapter-title">Chapter</p>
<p class="font-label-bold text-on-surface-variant text-body-sm" id="quiz-progress-text">Not started</p>
<div class="h-2.5 w-full max-w-md mt-2 bg-surface-container-high rounded-full relative overflow-hidden">
<div class="shiny-progress-bar absolute left-0 top-0 h-full bg-primary-container rounded-full transition-all duration-500" id="quiz-progress-bar" style="width:0%"></div>
</div>
</div>
<button class="settings-toggle-btn flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant/40 bg-surface-container-lowest font-label-bold text-body-sm text-on-surface-variant hover:text-primary shrink-0" id="btn-toggle-settings" type="button" aria-controls="settings-panel" aria-expanded="true">
<span class="material-symbols-outlined text-lg" id="settings-toggle-icon">chevron_left</span>
<span data-i18n="hideSettings" data-label-hide="Hide export" data-label-show="Show export" id="settings-toggle-label">Hide export</span>
</button>
</div>

<section class="bg-surface-container-lowest p-6 md:p-10 rounded-[2rem] shadow-lg border border-outline-variant/30 min-h-[480px] focus-target transition-all duration-500 relative overflow-hidden" id="quiz-container">
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-primary-fixed/20 blur-[100px] rounded-full pointer-events-none"></div>
<div class="absolute -top-20 -left-20 w-48 h-48 bg-secondary-fixed-dim/10 blur-[80px] rounded-full pointer-events-none"></div>
<div class="relative z-[1]">
<div class="flex flex-wrap items-start justify-between gap-4 mb-4">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1 split-text-target" id="page-title" data-i18n="hPractice">In-class test</h2>
<p class="text-body-sm text-on-surface-variant" data-i18n="txtPracticeHint">Fixed order · MCQ · Select answers, then Submit.</p>
<p class="text-body-sm text-on-surface-variant mt-1" data-i18n="txtKeyboardHint">Keyboard: A–D to answer.</p>
</div>
<button class="py-2.5 px-5 rounded-full border border-outline-variant/30 bg-surface font-label-bold text-body-sm hover:border-primary hover:text-primary transition-colors" id="btn-summary" type="button" hidden data-i18n="btnSummary">Session review</button>
</div>
<div class="summary-panel mb-6 p-5 rounded-2xl bg-surface-container-low border border-outline-variant/25" hidden id="summary-panel" role="region" aria-live="polite"></div>
<div id="quiz-area" class="quiz-empty text-center text-on-surface-variant py-12 text-body-sm">Loading…</div>
</div>
</section>
</div>
</main>

<div aria-hidden="true" id="quiz-pdf-sheet"></div>
<script
  src="./tool-back.js"
  data-hub="./in-class-test-hub.html?v=hub20260716"
  data-layout="inline"
  data-slot="#bio-tool-back-slot"
  data-variant="ghost"
  data-back-en="Back to In Class Test"
  data-back-zh="返回课堂测验"
  data-back-zh-hant="返回課堂測驗"
></script>
<script type="module" src="./js/inClassTestApp.js?v=ict20260716d"></script>
<script src="./draw-tool.js"></script>
</body>
</html>
