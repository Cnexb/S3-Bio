<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ch 5 Summary 摘要 | S3 Biology</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{color-scheme:light}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#eef2f6;color:#191c1e}
.summary-shell{display:flex;flex-direction:column;min-height:100dvh}
.summary-toolbar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding:.55rem .85rem;background:#fff;border-bottom:1px solid rgba(193,198,213,.55)}
.summary-toolbar__left{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.summary-toolbar a{color:#004e9f;font-weight:600;text-decoration:none;font-size:.8125rem}
.summary-toolbar a:hover{text-decoration:underline}
.summary-toolbar h1{margin:0;font-size:.95rem;font-weight:800;color:#004e9f}
.summary-main{flex:1;padding:1rem .85rem 2rem;display:flex;flex-direction:column;gap:1rem;align-items:center}
.summary-main img{width:100%;max-width:min(920px,100%);height:auto;object-fit:contain;display:block;border-radius:.45rem;background:#fff;border:1px solid rgba(193,198,213,.45);box-shadow:0 2px 10px rgba(0,0,0,.06)}
@media (min-width:900px){.summary-main{padding:1.25rem 1.25rem 2.5rem;gap:1.25rem}}
</style>
</head>
<body>
<div class="summary-shell">
  <header class="summary-toolbar">
    <div class="summary-toolbar__left">
      <a href="../slides.html" id="back-link">← Slides 投影片</a>
      <h1 id="page-title">Ch 5 Summary 摘要</h1>
    </div>
  </header>
  <main class="summary-main" id="summary-pages" aria-label="Chapter summary pages"></main>
</div>
<script>
(function(){
  const SUMMARY_PAGES=6;
  const SUMMARY_BASE="./embed/ch5fh-assets/ch5-summary/page-";
  const VERSION="20260711";
  const STRINGS={
    en:{back:"← Slides",title:"Ch 5 Summary"},
    zh:{back:"← 幻灯片",title:"第 5 章 摘要"},
    "zh-Hant":{back:"← 投影片",title:"第 5 章 摘要"}
  };
  function resolveLang(){
    try{
      const parentLang=window.parent.document.documentElement.lang;
      if(parentLang&&STRINGS[parentLang])return parentLang;
    }catch(_){}
    const local=document.documentElement.lang;
    if(local&&STRINGS[local])return local;
    return "zh-Hant";
  }
  const lang=resolveLang();
  const copy=STRINGS[lang]||STRINGS["zh-Hant"];
  document.getElementById("back-link").textContent=copy.back;
  document.getElementById("page-title").textContent=copy.title;
  document.documentElement.lang=lang;
  document.getElementById("summary-pages").innerHTML=Array.from({length:SUMMARY_PAGES},(_,i)=>{
    const n=String(i+1).padStart(2,"0");
    return `<img src="${SUMMARY_BASE}${n}.png?v=${VERSION}" alt="Summary page ${i+1}" loading="lazy" decoding="async"/>`;
  }).join("");
})();
</script>
</body>
</html>
