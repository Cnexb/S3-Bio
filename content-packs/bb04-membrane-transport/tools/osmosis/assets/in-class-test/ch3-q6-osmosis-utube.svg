<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-label="U-tube osmosis experiment with 2% and 10% sucrose solutions">
  <defs>
    <linearGradient id="liquidA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d9f5"/>
      <stop offset="100%" stop-color="#8ec1ef"/>
    </linearGradient>
    <linearGradient id="liquidB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb6e8"/>
      <stop offset="100%" stop-color="#4f97d9"/>
    </linearGradient>
    <clipPath id="clipLeft">
      <path d="M95 95 L305 95 L305 300 L170 300 Q95 300 95 225 Z"/>
    </clipPath>
    <clipPath id="clipRight">
      <path d="M515 95 L725 95 L725 225 Q725 300 650 300 L515 300 Z"/>
    </clipPath>
  </defs>

  <rect width="820" height="520" fill="#fff"/>

  <text x="145" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">Side A</text>
  <text x="620" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">Side B</text>

  <!-- U-tube outline -->
  <path d="M95 95 H305 V300 H170 Q95 300 95 225 V95 Z M515 95 H725 V225 Q725 300 650 300 H515 V95 Z"
        fill="none" stroke="#222" stroke-width="3"/>

  <!-- Liquids -->
  <rect x="96" y="170" width="208" height="130" fill="url(#liquidA)" clip-path="url(#clipLeft)"/>
  <rect x="516" y="170" width="208" height="130" fill="url(#liquidB)" clip-path="url(#clipRight)"/>

  <!-- Start level lines -->
  <line x1="96" y1="170" x2="304" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="516" y1="170" x2="724" y2="170" stroke="#333" stroke-width="2"/>

  <!-- Membrane -->
  <rect x="392" y="95" width="36" height="205" fill="#9aa3ad" stroke="#555" stroke-width="2"/>
  <g fill="#fff" opacity="0.85">
    <circle cx="404" cy="120" r="4"/><circle cx="416" cy="120" r="4"/>
    <circle cx="404" cy="140" r="4"/><circle cx="416" cy="140" r="4"/>
    <circle cx="404" cy="160" r="4"/><circle cx="416" cy="160" r="4"/>
    <circle cx="404" cy="180" r="4"/><circle cx="416" cy="180" r="4"/>
    <circle cx="404" cy="200" r="4"/><circle cx="416" cy="200" r="4"/>
    <circle cx="404" cy="220" r="4"/><circle cx="416" cy="220" r="4"/>
    <circle cx="404" cy="240" r="4"/><circle cx="416" cy="240" r="4"/>
    <circle cx="404" cy="260" r="4"/><circle cx="416" cy="260" r="4"/>
  </g>

  <!-- Solute particles A -->
  <g fill="#fff" stroke="#666" stroke-width="1">
    <circle cx="140" cy="210" r="5"/><circle cx="210" cy="230" r="5"/><circle cx="250" cy="205" r="5"/>
    <circle cx="180" cy="250" r="5"/><circle cx="230" cy="260" r="5"/>
  </g>

  <!-- Solute clusters B -->
  <g fill="#fff" stroke="#666" stroke-width="1">
    <g transform="translate(560 205)"><circle cx="0" cy="0" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="5" cy="8" r="4"/></g>
    <g transform="translate(620 230)"><circle cx="0" cy="0" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="5" cy="8" r="4"/></g>
    <g transform="translate(680 210)"><circle cx="0" cy="0" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="5" cy="8" r="4"/></g>
    <g transform="translate(590 260)"><circle cx="0" cy="0" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="5" cy="8" r="4"/></g>
    <g transform="translate(650 255)"><circle cx="0" cy="0" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="5" cy="8" r="4"/></g>
  </g>

  <!-- Labels -->
  <text x="200" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111">2% sucrose solution</text>
  <text x="620" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111">10% sucrose solution</text>

  <!-- Magnified inset -->
  <circle cx="700" cy="355" r="72" fill="#fff" stroke="#444" stroke-width="2"/>
  <rect x="650" y="345" width="18" height="30" fill="#9aa3ad"/>
  <rect x="628" y="350" width="22" height="20" fill="#8ec1ef"/>
  <rect x="668" y="350" width="22" height="20" fill="#4f97d9"/>
  <g fill="#fff" stroke="#666" stroke-width="0.8">
    <circle cx="636" cy="360" r="3"/><circle cx="642" cy="360" r="3"/>
    <circle cx="676" cy="358" r="3"/><circle cx="682" cy="358" r="3"/><circle cx="679" cy="364" r="3"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M634 372 C646 378 652 378 664 372"/>
    <path d="M634 378 C646 384 652 384 664 378"/>
    <path d="M634 384 C646 390 652 390 664 384"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="410" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111">After 2 hours, what would be the expected observation?</text>
</svg>
